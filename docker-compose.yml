# CarePath local development stack.
# Usage: docker compose up -d postgres
# Optional profiles: qdrant (Phase 5), neo4j (Phase 6), livekit (Phase 8)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: carepath
      POSTGRES_PASSWORD: carepath
      POSTGRES_DB: carepath
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carepath -d carepath"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.13.6
    profiles: ["qdrant"]
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    profiles: ["neo4j"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-carepath_dev}
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  neo4j_data:
