[project]
name = "carepath-ai"
version = "0.1.0"
description = "CarePath AI - evidence-aware care navigation research prototype (synthetic data only, not a medical device)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary - research prototype" }
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.2",
    "asyncpg>=0.30,<1.0",
    "aiosqlite>=0.20,<1.0",
    "alembic>=1.14,<2",
    "httpx>=0.27,<1.0",
    "streamlit>=1.40,<2",
    "langgraph>=0.3,<1",
    "qdrant-client>=1.20.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "postgres: requires a reachable PostgreSQL (set CAREPATH_TEST_DATABASE_URL)",
    "live_model: performs a real model call (requires configured NVIDIA_API_KEY and CAREPATH_RUN_LIVE_MODEL=1)",
    "smoke: application smoke checks",
]
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["Project_details"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM"]
ignore = [
    "S101",   # assert is fine in tests
    "RUF012", # pydantic/sqlalchemy class attributes
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["carepath", "backend"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
